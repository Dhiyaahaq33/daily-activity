name: Daily activity

on:
  schedule:
    - cron: '0 18 * * *'   # 18:00 UTC = 01:00 WIB every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Log 10,000 timestamped entries
        run: |
          git config user.name "Dhiyaahaq33"
          git config user.email "139051782+Dhiyaahaq33@users.noreply.github.com"
          for i in $(seq 1 10000); do
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') #$i" >> log.txt
            git add log.txt
            git commit -q -m "chore: daily activity log ($i/10000)"
            if [ $((i % 250)) -eq 0 ]; then
              echo "Progress: $i/10000 ($((i * 100 / 10000))%)"
            fi
          done
          echo "Progress: 10000/10000 (100%) -- pushing now"
          git push
